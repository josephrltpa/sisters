<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#f9a8d4"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Woven pattern (left) -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="60" height="80" rx="8" fill="white" opacity="0.3"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="30" x2="50" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="60" x2="50" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="5" x2="20" y2="75" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="40" y1="5" x2="40" y2="75" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Cake (right) -->
  <g transform="translate(100, 50)">
    <rect x="0" y="40" width="60" height="30" rx="6" fill="white" opacity="0.9"/>
    <rect x="0" y="40" width="60" height="12" rx="6" fill="white"/>
    <rect x="8" y="20" width="44" height="22" rx="6" fill="white" opacity="0.9"/>
    <rect x="8" y="20" width="44" height="10" rx="6" fill="white"/>
    <circle cx="30" cy="14" r="8" fill="#fb7185"/>
    <circle cx="15" cy="40" r="4" fill="#fce7f3"/>
    <circle cx="30" cy="42" r="4" fill="#fce7f3"/>
    <circle cx="45" cy="40" r="4" fill="#fce7f3"/>
  </g>
</svg>
