<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#f9a8d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Woven pattern (left) -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="160" height="220" rx="20" fill="white" opacity="0.3"/>
    <line x1="25" y1="40" x2="135" y2="40" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="25" y1="80" x2="135" y2="80" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="25" y1="120" x2="135" y2="120" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="25" y1="160" x2="135" y2="160" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="55" y1="15" x2="55" y2="205" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="105" y1="15" x2="105" y2="205" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Cake (right) -->
  <g transform="translate(265, 130)">
    <rect x="0" y="110" width="160" height="80" rx="16" fill="white" opacity="0.9"/>
    <rect x="0" y="110" width="160" height="32" rx="16" fill="white"/>
    <rect x="20" y="55" width="120" height="60" rx="16" fill="white" opacity="0.9"/>
    <rect x="20" y="55" width="120" height="28" rx="16" fill="white"/>
    <circle cx="80" cy="38" r="22" fill="#fb7185"/>
    <circle cx="40" cy="110" r="10" fill="#fce7f3"/>
    <circle cx="80" cy="114" r="10" fill="#fce7f3"/>
    <circle cx="120" cy="110" r="10" fill="#fce7f3"/>
  </g>
</svg>
