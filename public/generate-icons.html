<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Click the buttons below to download PNG icons for your PWA</p>
    
    <div>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <br>
        <button onclick="downloadIcon(512)">Download 512x512 Icon</button>
    </div>
    
    <div>
        <canvas id="canvas192" width="192" height="192"></canvas>
        <br>
        <button onclick="downloadIcon(192)">Download 192x192 Icon</button>
    </div>
    
    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 512;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#38bdf8');
            gradient.addColorStop(0.5, '#7dd3fc');
            gradient.addColorStop(1, '#f9a8d4');
            
            // Rounded rectangle background
            const radius = 100 * scale;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            // Woven pattern (left side)
            ctx.save();
            ctx.translate(70 * scale, 100 * scale);
            
            // Background rectangle
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(0, 0, 160 * scale, 220 * scale);
            
            // Horizontal lines
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8 * scale;
            ctx.lineCap = 'round';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(25 * scale, (40 + i * 40) * scale);
                ctx.lineTo(135 * scale, (40 + i * 40) * scale);
                ctx.stroke();
            }
            
            // Vertical lines
            ctx.lineWidth = 5 * scale;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.moveTo(55 * scale, 15 * scale);
            ctx.lineTo(55 * scale, 205 * scale);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(105 * scale, 15 * scale);
            ctx.lineTo(105 * scale, 205 * scale);
            ctx.stroke();
            ctx.globalAlpha = 1;
            
            ctx.restore();
            
            // Cake (right side)
            ctx.save();
            ctx.translate(265 * scale, 130 * scale);
            
            // Bottom layer
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(0, 110 * scale, 160 * scale, 80 * scale);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 110 * scale, 160 * scale, 32 * scale);
            
            // Top layer
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(20 * scale, 55 * scale, 120 * scale, 60 * scale);
            ctx.fillStyle = 'white';
            ctx.fillRect(20 * scale, 55 * scale, 120 * scale, 28 * scale);
            
            // Cherry
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.arc(80 * scale, 38 * scale, 22 * scale, 0, Math.PI * 2);
            ctx.fill();
            
            // Frosting dots
            ctx.fillStyle = '#fce7f3';
            ctx.beginPath();
            ctx.arc(40 * scale, 110 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(80 * scale, 114 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(120 * scale, 110 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById('canvas' + size);
            drawIcon(canvas);
            
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Draw icons on page load
        window.onload = function() {
            drawIcon(document.getElementById('canvas512'));
            drawIcon(document.getElementById('canvas192'));
        };
    </script>
</body>
</html>
